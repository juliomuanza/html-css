<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exer-pseudos</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 1em;
        }

        /* Negritamos os links, removemos o sublinhado e colocamos a cor vermelha */
        a {
            font-weight: bold;
            text-decoration: none;
            color: red;
        }

        /* Para links visitados, mude a cor para vermelho escuro */
        a:visited {
            color: darkred;
        }

        /* Ao passar o mouse no link, apareça o sublinhado */
        a:hover {
            text-decoration: underline;
        }

        /* Adicionando as configurações da class especial*/
        .especial:hover {
            color: white;
            background-color: black;
            text-decoration: none;
        }

        .especial::before {
            content: '»';
            font-weight: lighter;
        }

        .especial::after {
            content: '«';
            font-weight: lighter;
        }

    </style>
</head>
<body>
    <h1>Personalizando um link</h1>
    <p>
        Para aprender HTML5 e CSS3, acesse o
        <a href="https://gustavoguanabara.github.io">
            GitHub do Guanabara
        </a>
    </p>

    <p>
        Se quiser conhecer mais sobre os pradrões, visite o site do 
        <a href="https://www.w3c.br">Escritório do W3C no Brazil</a>
    </p>

    <p>
        Para acompanhar os cursos, acesse o 
        <a href="https://www.youtube.com/cursoemvideo/" class="especial"> canal do Cursoemvideo </a>
    </p>
</body>
</html>
